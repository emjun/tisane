[tool.poetry]
name = "tisane"
version = "0.1.0"
description = "Tisane: Authoring Statistical Models via Formal Reasoning from Conceptual and Data Relationships"
readme = "README.md"
authors = ["Eunice Jun <eunice.m.jun@gmail.com>", "Audrey Seo <audreyleeseo@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
pandas = ">=1.5.0"
networkx = ">=2.8"
statsmodels = ">=0.14.0"
more-itertools = ">=8.7.0"
pydot = ">=1.4.2"
tweedie = ">=0.0.7"
Flask = ">=2.0.0"
plotly = ">=5.0.0"
dash = ">=2.0.0"
dash-bootstrap-components = ">=1.0.0"
dash-daq = ">=0.5.0"
patsy = ">=0.5.1"
pymer4 = ">=0.7.5"
jupyter-dash = ">=0.4.0"
jupyter = ">=1.0.0"
h5py = ">=3.8.0"
toml = ">=0.10.2"
ipykernel = ">=6.20.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
coverage = ">=7.0.0"
black = ">=23.0.0"
Sphinx = ">=7.0.0"
pydata-sphinx-theme = ">=0.14.0"
sphinx-autoapi = ">=3.0.0"
numpydoc = ">=1.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
